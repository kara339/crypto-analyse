name: Collecte quotidienne

on:
  schedule:
    - cron: "0 7 * * *"   # tous les jours à 7h (heure UTC, soit la même heure à Abidjan)
  workflow_dispatch:       # permet aussi de la lancer à la main

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer la collecte
        run: python collecte.py

      - name: Enregistrer les données
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Collecte du $(date -u +%F)"
          git push
