name: Découverte hebdomadaire

on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:
    inputs:
      ecrire:
        description: "Cocher pour enregistrer les pièces (sinon essai à blanc)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  decouverte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer la découverte
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.ecrire }}" = "true" ]; then
            python decouverte.py ecrire
          else
            python decouverte.py
          fi

      - name: Enregistrer les données
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add pieces.txt data/
          git diff --staged --quiet || git commit -m "Découverte du $(date -u +%F)"
          git pull --rebase
          git push
